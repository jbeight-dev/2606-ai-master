document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-for>\n            <div onclick=\"{{ openCreate }}\" style=\"border:1.5px dashed #CBD5E1;border-radius:14px;padding:18px 20px;cursor:pointer;display:flex;gap:14px;align-items:center\">\n              <div style=\"width:42px;height:42px;border-radius:11px;background:{{ accentSoft }};color:{{ accent }};display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0\">＋<\u002Fdiv>\n              <div><div style=\"font-family:Poppins,sans-serif;font-weight:600;font-size:15px;color:#334155\">새 Knowledge Space<\u002Fdiv><div style=\"font-size:12.5px;color:#8A98A9;margin-top:3px\">이름과 한 줄 설명을 입력해 시작하세요<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isRegister }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:22px\">\n          <div onclick=\"{{ startAnalysis }}\" style=\"border:1.5px dashed #CBD5E1;border-radius:14px;background:#FFFFFF;padding:46px 32px;text-align:center;cursor:pointer\">\n            <div style=\"width:62px;height:62px;border-radius:16px;background:{{ accentSoft }};color:{{ accent }};display:flex;align-items:center;justify-content:center;margin:0 auto 16px\">\n              <svg width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 16V4\"><\u002Fpath><path d=\"M7 9l5-5 5 5\"><\u002Fpath><path d=\"M5 16v3a1 1 0 001 1h12a1 1 0 001-1v-3\"><\u002Fpath><\u002Fsvg>\n            <\u002Fdiv>\n            <div style=\"font-family:Poppins,sans-serif;font-weight:600;font-size:17px\">문서를 여기로 끌어다 놓으세요<\u002Fdiv>\n            <div style=\"color:#8A98A9;font-size:13px;margin-top:5px\">또는 클릭하여 파일 선택 · <span style=\"font-family:Inconsolata,monospace\">docx, xlsx, pdf<\u002Fspan><\u002Fdiv>\n            <div style=\"margin-top:18px\"><span style=\"{{ primaryBtn }}\">파일 선택<\u002Fspan><\u002Fdiv>\n            <div style=\"color:#B0BCCC;font-size:12px;margin-top:16px\">업로드 후 별도 작업 없이 AI가 자동으로 Wiki를 생성합니다<\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ showProgress }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#FFFFFF;border:1px solid #E8EDF3;border-radius:14px;padding:22px 24px\">\n              <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:16px\">\n                <sc-if value=\"{{ analyzing }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"width:16px;height:16px;border:2px solid {{ accentSoftBorder }};border-top-color:{{ accent }};border-radius:50%;display:inline-block;animation:spin .7s linear infinite\"><\u002Fspan><\u002Fsc-if>\n                <sc-if value=\"{{ analysisDone }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width:18px;height:18px;border-radius:50%;background:#16A34A;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px\">✓<\u002Fspan><\u002Fsc-if>\n                <span style=\"font-family:Poppins,sans-serif;font-weight:600;font-size:14px\">{{ analysisHeading }}<\u002Fspan>\n                <span style=\"font-family:Inconsolata,monospace;font-size:11px;color:#94A3B8;margin-left:auto\">사용자 매뉴얼.docx<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:9px\">\n                <sc-for list=\"{{ visibleSteps }}\" as=\"step\" hint-placeholder-count=\"3\">\n                  <div style=\"display:flex;align-items:center;gap:10px;font-size:13.5px;color:#334155\">\n                    <span style=\"width:18px;height:18px;border-radius:50%;background:#ECFDF5;color:#16A34A;display:inline-flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0\">✓<\u002Fspan>\n                    {{ step.text }}\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <sc-if value=\"{{ analysisDone }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"margin-top:18px;padding-top:16px;border-top:1px solid #F1F5F9;display:flex;align-items:center;justify-content:space-between\">\n                  <span style=\"font-size:13px;color:#64748B\">12개 화면 · 18개 API · 32개 용어가 구조화되었습니다<\u002Fspan>\n                  <button onclick=\"{{ goReview }}\" style=\"{{ primaryBtn }}\">검수하러 가기 →<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"background:#FFFFFF;border:1px solid #E8EDF3;border-radius:14px;overflow:hidden\">\n            <div style=\"padding:16px 22px;border-bottom:1px solid #F1F5F9;display:flex;align-items:center;justify-content:space-between\">\n              <span style=\"font-family:Poppins,sans-serif;font-weight:600;font-size:15px\">최근 업로드<\u002Fspan>\n              <span style=\"font-family:Inconsolata,monospace;font-size:11px;color:#94A3B8\">{{ docCount }} files<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ docsView }}\" as=\"doc\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;align-items:center;gap:14px;padding:13px 22px;border-bottom:1px solid #F5F7FA\">\n                <div style=\"width:34px;height:34px;border-radius:8px;background:#F1F5F9;color:#64748B;display:flex;align-items:center;justify-content:center;flex-shrink:0\">\n                  <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M13 3H6a1 1 0 00-1 1v16a1 1 0 001 1h12a1 1 0 001-1V8z\"><\u002Fpath><path d=\"M13 3v5h5\"><\u002Fpath><\u002Fsvg>\n                <\u002Fdiv>\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"font-weight:500;font-size:14px\">{{ doc.name }}<\u002Fdiv>\n                  <div style=\"font-size:12px;color:#94A3B8\">{{ doc.type }} · {{ doc.date }}<\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"{{ doc.badgeStyle }}\">\n                  <sc-if value=\"{{ doc.spinner }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width:11px;height:11px;border:2px solid #BFDBFE;border-top-color:#3B82F6;border-radius:50%;display:inline-block;animation:spin .7s linear infinite;margin-right:5px;vertical-align:-1px\"><\u002Fspan><\u002Fsc-if>\n                  {{ doc.statusLabel }}\n                <\u002Fspan>\n                <sc-if value=\"{{ doc.showReview }}\" hint-placeholder-val=\"{{ false }}\"><button onclick=\"{{ doc.onReview }}\" style=\"background:none;border:1px solid #E2E8F0;border-radius:7px;padding:6px 12px;font-size:12.5px;font-weight:500;color:#334155;cursor:pointer;font-family:inherit\">검수<\u002Fbutton><\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ noDocs }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:26px 22px;text-align:center;color:#94A3B8;font-size:13px\">아직 등록된 문서가 없습니다. 위 영역에 문서를 올려 이 공간의 Wiki를 시작하세요.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isReview }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px\">\n          <div style=\"display:flex;gap:12px\">\n            <sc-for list=\"{{ stats }}\" as=\"s\" hint-placeholder-count=\"5\">\n              <div style=\"flex:1;background:#FFFFFF;border:1px solid #E8EDF3;border-radius:12px;padding:14px 16px\">\n                <div style=\"font-family:Poppins,sans-serif;font-weight:600;font-size:24px;letter-spacing:-.02em\">{{ s.n }}<\u002Fdiv>\n                <div style=\"font-size:12px;color:#8A98A9;margin-top:2px\">{{ s.k }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:220px 1fr 1fr;gap:16px;align-items:start\">\n            <div style=\"background:#FFFFFF;border:1px solid #E8EDF3;border-radius:12px;padding:14px 12px\">\n              <div style=\"font-family:Inconsolata,monospace;font-size:10px;font-weight:600;letter-spacing:.1em;color:#B6C2D2;padding:4px 8px 8px\">생성된 항목<\u002Fdiv>\n              <div style=\"font-size:11px;font-weight:600;color:#3B82F6;padding:6px 8px 3px\">Screen<\u002Fdiv>\n              <div style=\"font-size:13px;color:#475569;padding:4px 8px;border-radius:6px;background:#F4F8FF\">SCR-001 설비조회<\u002Fdiv>\n              <div style=\"font-size:13px;color:#475569;padding:4px 8px\">SCR-002 LOT 추적<\u002Fdiv>\n              <div style=\"font-size:11px;font-weight:600;color:#8B5CF6;padding:8px 8px 3px\">API<\u002Fdiv>\n              <div style=\"font-size:13px;color:#475569;padding:4px 8px\">Search API<\u002Fdiv>\n              <div style=\"font-size:13px;color:#475569;padding:4px 8px\">Login API<\u002Fdiv>\n              <div style=\"font-size:11px;font-weight:600;color:#16A34A;padding:8px 8px 3px\">Glossary<\u002Fdiv>\n              <div style=\"font-size:13px;color:#475569;padding:4px 8px\">LOT · Yield · Judge<\u002Fdiv>\n              <div style=\"font-size:11px;font-weight:600;color:#D97706;padding:8px 8px 3px\">DB Table<\u002Fdiv>\n              <div style=\"font-size:13px;color:#475569;padding:4px 8px\">Equipment · AI Model<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:#FFFFFF;border:1px solid #E8EDF3;border-radius:12px;overflow:hidden\">\n              <div style=\"padding:11px 16px;border-bottom:1px solid #F1F5F9;display:flex;align-items:center;gap:8px\">\n                <span style=\"width:8px;height:8px;border-radius:50%;background:#CBD5E1\"><\u002Fspan>\n                <span style=\"font-weight:600;font-size:13px;white-space:nowrap\">원본 문서<\u002Fspan>\n                <span style=\"font-family:Inconsolata,monospace;font-size:11px;color:#94A3B8;margin-left:auto\">사용자 매뉴얼.docx<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"padding:18px 18px;font-family:Inconsolata,monospace;font-size:12.5px;line-height:1.85;color:#475569;white-space:pre-wrap\">3. 설비조회 (Equipment Inquiry)\n\n설비조회 화면은 라인별 설비의 현재 상태를 조회하는 화면이다. 사용자는 LOT 번호 또는 설비 ID로 검색할 수 있으며, 검색 결과로 설비의 가동 상태, Yield, 최근 Judge 이력을 확인한다.\n\n- 검색 조건 : LOT, 설비 ID, 기간\n- 표시 항목 : 설비명, 상태, Yield(%), 최근 Judge\n- 관련 API : /api/equipment/search<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:#FFFFFF;border:1px solid {{ accentSoftBorder }};border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(59,130,246,.06)\">\n              <div style=\"padding:11px 16px;border-bottom:1px solid #F1F5F9;display:flex;align-items:center;gap:8px\">\n                <span style=\"font-family:Inconsolata,monospace;font-size:10px;font-weight:600;background:{{ accentSoft }};color:{{ accent }};border-radius:5px;padding:2px 6px\">AI<\u002Fspan>\n                <span style=\"font-weight:600;font-size:13px;white-space:nowrap\">AI 생성 결과<\u002Fspan>\n                <span style=\"font-family:Inconsolata,monospace;font-size:11px;color:#94A3B8;margin-left:auto\">Screen · SCR-001<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"padding:16px 18px;display:flex;flex-direction:column;gap:14px\">\n                <div><div style=\"font-size:11px;color:#94A3B8;font-weight:600;margin-bottom:3px\">목적<\u002Fdiv><div style=\"font-size:13.5px;color:#334155\">라인별 설비의 현재 상태와 Yield를 조회<\u002Fdiv><\u002Fdiv>\n                <div><div style=\"font-size:11px;color:#94A3B8;font-weight:600;margin-bottom:4px\">기능<\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:#334155\">\n                    <div>· LOT / 설비 ID 검색<\u002Fdiv><div>· 상태 · Yield(%) 표시<\u002Fdiv><div>· 최근 Judge 이력 조회<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div><div style=\"font-size:11px;color:#94A3B8;font-weight:600; play:flex;align-items:center;justify-content:center;z-index:50;padding:20px\">\n      <div onclick=\"{{ stop }}\" style=\"width:460px;max-width:100%;background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(15,23,42,.25);overflow:hidden\">\n        <div style=\"padding:22px 24px 6px\">\n          <div style=\"font-family:Poppins,sans-serif;font-weight:600;font-size:18px;letter-spacing:-.01em\">새 Knowledge Space<\u002Fdiv>\n          <div style=\"font-size:13px;color:#8A98A9;margin-top:4px\">지식을 담을 공간을 만듭니다. 문서는 이 공간에 등록됩니다.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:16px 24px 8px;display:flex;flex-direction:column;gap:16px\">\n          <div>\n            <label style=\"font-size:12px;font-weight:600;color:#475569;display:block;margin-bottom:6px\">이름<\u002Flabel>\n            <input value=\"{{ newName }}\" oninput=\"{{ onNameInput }}\" placeholder=\"예: 반도체 설비관리\" style=\"{{ modalInput }}\">\n          <\u002Fdiv>\n          <div>\n            <label style=\"font-size:12px;font-weight:600;color:#475569;display:block;margin-bottom:6px\">한 줄 설명<\u002Flabel>\n            <input value=\"{{ newDesc }}\" oninput=\"{{ onDescInput }}\" placeholder=\"이 공간에 담길 지식을 한 줄로 설명하세요\" style=\"{{ modalInput }}\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:16px 24px 22px;display:flex;justify-content:flex-end;gap:10px\">\n          <button onclick=\"{{ closeCreate }}\" style=\"background:#fff;border:1px solid #E2E8F0;border-radius:9px;padding:10px 16px;font-size:13.5px;font-weight:500;color:#334155;cursor:pointer;font-family:inherit\">취소<\u002Fbutton>\n          <button onclick=\"{{ createSpace }}\" style=\"{{ createBtnStyle }}\">만들기<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#3B82F6&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#3B82F6&quot;,&quot;#0EA5E9&quot;,&quot;#16A34A&quot;,&quot;#8B5CF6&quot;],&quot;section&quot;:&quot;Theme&quot;},&quot;englishLabels&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Theme&quot;},&quot;density&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;compact&quot;,&quot;options&quot;:[&quot;comfortable&quot;,&quot;compact&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Theme&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    active: 'register',\n    analyzing: false, analysisDone: false, analysisStep: 0,\n    docs: [\n      { id: 1, name: '사용자 매뉴얼.txt', type: '사용자 매뉴얼', date: '2026-06-27', status: 'approved' },\n    ],\n    approved: false,\n    wikiNode: 'scr-001',\n    search: '',\n    messages: [],\n    input: '',\n    thinking: false,\n    collapsed: false,\n    spaces: [\n      { id: 'sp-equip', name: '반도체 설비관리', desc: '설비조회·LOT·Yield 등 설비 운영 지식', color: '#3B82F6', docs: 1, seeded: true },\n    ],\n    activeSpaceId: null,\n    spaceMenuOpen: false,\n    createOpen: false,\n    newName: '',\n    newDesc: '',\n  };\n\n  steps = ['문서 종류 : 사용자 매뉴얼 식별', '화면 12개 발견', 'API 18개 발견', 'DB 테이블 7개 발견', '업무용어 32개 발견', 'FAQ 14개 생성'];\n\n  componentWillUnmount() { clearInterval(this._t); clearTimeout(this._th); }\n\n  go(k) { this.setState({ active: k, spaceMenuOpen: false }); }\n\n  toggleCollapse() { this.setState(s => ({ collapsed: !s.collapsed })); }\n\n  toggleSpaceMenu() { this.setState(s => ({ spaceMenuOpen: !s.spaceMenuOpen })); }\n\n  selectSpace(id) { this.setState({ activeSpaceId: id, spaceMenuOpen: false, active: 'register' }); }\n\n  openCreate() { this.setState({ createOpen: true, spaceMenuOpen: false, newName: '', newDesc: '' }); }\n\n  closeCreate() { this.setState({ createOpen: false }); }\n\n  createSpace() {\n    const name = (this.state.newName || '').trim();\n    if (!name) return;\n    const id = 'sp-' + Date.now();\n    const palette = ['#3B82F6', '#0EA5E9', '#16A34A', '#8B5CF6', '#D97706'];\n    const color = palette[this.state.spaces.length % palette.length];\n    this.setState(s => ({\n      spaces: [...s.spaces, { id, name, desc: (s.newDesc || '').trim() || '설명 없음', color, docs: 0, seeded: false }],\n      activeSpaceId: id, createOpen: false, active: 'register',\n    }));\n  }\n\n  startAnalysis() {\n    if (this.state.analyzing) return;\n    this.setState({ active: 'register', analyzing: true, analysisDone: false, analysisStep: 0 });\n    clearInterval(this._t);\n    this._t = setInterval(() => {\n      this.setState(s => {\n        const n = s.analysisStep + 1;\n        if (n >= this.steps.length) { clearInterval(this._t); return { analysisStep: this.steps.length, analyzing: false, analysisDone: true }; }\n        return { analysisStep: n };\n      });\n    }, 620);\n  }\n\n  approve() {\n    this.setState(s => ({ approved: true, docs: s.docs.map(d => d.id === 2 ? { ...d, status: 'approved' } : d) }));\n  }\n\n  selectNode(id) { this.setState({ wikiNode: id }); }\n\n  ask(text) {\n    const q = (text != null ? text : this.state.input).trim();\n    if (!q) return;\n    const res = this.answer(q);\n    this.setState(s => ({ messages: [...s.messages, { role: 'user', text: q }], input: '', thinking: true }));\n    clearTimeout(this._th);\n    this._th = setTimeout(() => {\n      this.setState(s => ({ thinking: false, messages: [...s.messages, { role: 'assistant', text: res.a, sources: res.sources }] }));\n    }, 850);\n  }\n\n  answer(q) {\n    const t = q.toLowerCase();\n    const QA = [\n      { k: ['api', '설비조회', '설비 조회'], a: '설비조회 화면(SCR-001)은 Search API를 통해 설비 데이터를 조회합니다.\\n\\n· GET /api/equipment/search — LOT 또는 설비 ID로 설비 상태·Yield를 검색\\n· 응답 데이터는 Equipment, Judge_History 테이블을 기반으로 구성됩니다.', sources: [{ type: 'Screen', label: 'SCR-001 설비조회', node: 'scr-001' }, { type: 'API', label: 'Search API', node: 'api-search' }, { type: 'Table', label: 'Equipment', node: 'tbl-equipment' }] },\n      { k: ['lot'], a: 'LOT은 동일한 공정 조건에서 함께 생산·이동되는 제품의 묶음 단위입니다. 추적성(traceability)의 기본 단위이며, 설비조회와 LOT 추적 화면에서 검색 키로 사용됩니다.', sources: [{ type: 'Glossary', label: 'LOT', node: 'glo-lot' }, { type: 'Screen', label: 'SCR-002 LOT 추적', node: 'scr-002' }] },\n      { k: ['yield', '수율'], a: 'Yield(수율)는 투입 대비 양품 비율(%)을 의미합니다. 설비조회 화면에서 설비별 Yield를 표시하며, 값은 Judge_History 테이블의 판정 결과로 집계됩니다.', sources: [{ type: 'Glossary', label: 'Yield', node: 'glo-yield' }, { type: 'Screen', label: 'SCR-001 설비조회', node: 'scr-001' }, { type: 'Table', label: 'Judge_History', node: 'tbl-judge' }] },\n      { k: ['judge', '판정'], a: 'Judge는 검사 공정에서 제품의 양품·불량을 판정한 결과입니다. 최근 Judge 이력은 설비조회 화면(SCR-001)에서 확인할 수 있습니다.', sources: [{ type: 'Glossary', label: 'Judge', node: 'glo-judge' }, { type: 'Screen', label: 'SCR-001 설비조회', node: 'scr-001' }] },\n    ];\n    for (const item of QA) { if (item.k.some(kw => t.includes(kw))) return item; }\n    return { a: '관련 위키 문서를 찾았습니다. 아래 출처에서 자세한 내용을 확인하실 수 있습니다.', sources: [{ type: 'Screen', label: 'SCR-001 설비조회', node: 'scr-001' }, { type: 'API', label: 'Search API', node: 'api-search' }, { type: 'Glossary', label: 'LOT', node: 'glo-lot' }] };\n  }\n\n  colorFor(type) {\n    const m = { Screen: '#3B82F6', API: '#8B5CF6', Glossary: '#16A34A', Table: '#D97706', DB: '#0EA5E9', Requirement: '#6366F1', Release: '#64748B', System: '#0F766E' };\n    return m[type] || '#64748B';\n  }\n\n  rawGroups() {\n    return [\n      { label: 'Systems', color: '#0F766E', items: [{ id: 'sys-mes', label: 'AI 설비관리시스템', en: 'MES-AI' }] },\n      { label: 'Requirements', color: '#6366F1', items: [{ id: 'req-001', label: '설비 상태 실시간 조회', en: 'REQ-001' }] },\n      { label: 'Screens', color: '#3B82F6', items: [{ id: 'scr-001', label: '설비조회', en: 'SCR-001' }, { id: 'scr-002', label: 'LOT 추적', en: 'SCR-002' }] },\n      { label: 'API', color: '#8B5CF6', items: [{ id: 'api-search', label: 'Search API', en: 'GET' }, { id: 'api-login', label: 'Login API', en: 'POST' }] },\n      { label: 'Tables', color: '#D97706', items: [{ id: 'tbl-equipment', label: 'Equipment', en: 'DB' }, { id: 'tbl-judge', label: 'Judge_History', en: 'DB' }] },\n      { label: 'Glossary', color: '#16A34A', items: [{ id: 'glo-lot', label: 'LOT' }, { id: 'glo-yield', label: 'Yield' }, { id: 'glo-judge', label: 'Judge' }] },\n      { label: 'Release Note', color: '#64748B', items: [{ id: 'rel-3', label: 'v3.0 릴리즈', en: '2026' }] },\n    ];\n  }\n\n  pages() {\n    return {\n      'scr-001': { crumb: 'Screens / SCR-001', title: '설비조회', en: 'SCR-001 · Equipment Inquiry', status: 'Approved · v3', tags: ['설비', '조회', 'LOT', 'Yield'],\n        meta: [{ k: '목적', v: '설비 상태·Yield 조회' }, { k: '담당', v: '설비기술팀' }, { k: '관련 시스템', v: 'MES-AI' }, { k: '상태', v: '운영 중' }],\n        functions: ['LOT 번호 또는 설비 ID로 설비 검색', '설비 가동 상태 및 Yield(%) 표시', '최근 Judge 판정 이력 조회', '기간별 필터링'],\n        apis: [{ method: 'GET', path: '/api/equipment/search', desc: '설비 상태·Yield 검색' }, { method: 'GET', path: '/api/equipment/{id}/judge', desc: 'Judge 이력' }],\n        tables: ['Equipment', 'Judge_History'],\n        faqs: [{ q: '설비가 검색되지 않아요', a: 'LOT 또는 설비 ID 형식을 확인하세요. 폐기 설비는 기본 필터에서 제외됩니다.' }, { q: 'Yield가 0%로 표시돼요', a: '해당 기간에 Judge 데이터가 없을 수 있습니다. 기간을 넓혀 다시 조회하세요.' }] },\n      'scr-002': { crumb: 'Screens / SCR-002', title: 'LOT 추적', en: 'SCR-002 · LOT Tracking', status: 'Approved · v3', tags: ['LOT', '추적'],\n        meta: [{ k: '목적', v: 'LOT의 공정 이동 경로 추적' }, { k: '담당', v: '생산관리팀' }, { k: '관련 시스템', v: 'MES-AI' }, { k: '상태', v: '운영 중' }],\n        functions: ['LOT 번호로 전체 공정 이력 조회', '경유 설비 및 시간 표시', '불량 발생 지점 하이라이트'],\n        apis: [{ method: 'GET', path: '/api/lot/{id}/trace', desc: 'LOT 이동 경로' }],\n        tables: ['Lot_History', 'Equipment'], faqs: [{ q: '오래된 LOT도 조회되나요?', a: '최근 24개월 데이터까지 조회 가능합니다.' }] },\n      'api-search': { crumb: 'API / Search API', title: 'Search API', en: 'GET /api/equipment/search', status: 'Stable', tags: ['API', '검색'],\n        definition: '설비 상태와 Yield를 LOT 또는 설비 ID 기준으로 검색하는 엔드포인트입니다. 설비조회(SCR-001) 화면에서 호출합니다.',\n        meta: [{ k: 'Method', v: 'GET' }, { k: '인증', v: 'Bearer Token' }, { k: '사용 화면', v: 'SCR-001' }, { k: '상태', v: 'Stable' }],\n        functions: [], apis: [{ method: 'GET', path: '/api/equipment/search?lot={lot}', desc: 'LOT 기준 검색' }, { method: 'GET', path: '/api/equipment/search?id={id}', desc: '설비 ID 기준 검색' }],\n        tables: ['Equipment', 'Judge_History'], faqs: [] },\n      'glo-lot': { crumb: 'Glossary / LOT', title: 'LOT', en: 'Glossary Term', status: '용어', tags: ['용어', '추적성'],\n        definition: 'LOT은 동일한 공정 조건에서 함께 생산·이동되는 제품의 묶음 단위입니다. 추적성(traceability)의 기본 단위로, 설비조회·LOT 추적 화면의 검색 키로 사용됩니다.',\n        meta: [{ k: '분류', v: 'Glossary' }, { k: '사용 화면', v: 'SCR-001, SCR-002' }], functions: [], apis: [], tables: [], faqs: [] },\n      'glo-yield': { crumb: 'Glossary / Yield', title: 'Yield', en: 'Glossary Term', status: '용어', tags: ['용어', '수율'],\n        definition: 'Yield(수율)는 투입 대비 양품 비율(%)입니다. Judge_History의 판정 결과로 집계되며 설비조회 화면에 표시됩니다.',\n        meta: [{ k: '분류', v: 'Glossary' }, { k: '집계 출처', v: 'Judge_History' }], functions: [], apis: [], tables: [], faqs: [] },\n      'glo-judge': { crumb: 'Glossary / Judge', title: 'Judge', en: 'Glossary Term', status: '용어', tags: ['용어', '판정'],\n        definition: 'Judge는 검사 공정에서 제품의 양품·불량을 판정한 결과입니다. 최근 Judge 이력은 설비조회 화면에서 확인합니다.',\n        meta: [{ k: '분류', v: 'Glossary' }, { k: '사용 화면', v: 'SCR-001' }], functions: [], apis: [], tables: [], faqs: [] },\n      'tbl-equipment': { crumb: 'Tables / Equipment', title: 'Equipment', en: 'DB Table', status: 'Table', tags: ['DB', '설비'],\n        definition: '설비 마스터 테이블. 설비 ID, 라인, 상태, 최신 Yield 등을 저장합니다.',\n        meta: [{ k: 'PK', v: 'equipment_id' }, { k: '주요 컬럼', v: 'line, status, yield' }, { k: '참조 화면', v: 'SCR-001' }], functions: [], apis: [], tables: [], faqs: [] },\n    };\n  }\n\n  genericPage(id) {\n    const all = this.rawGroups().flatMap(g => g.items.map(it => ({ ...it, group: g.label })));\n    const f = all.find(x => x.id === id) || { label: id, group: 'Wiki', en: '' };\n    return { crumb: f.group + ' / ' + f.label, title: f.label, en: f.en || 'AI 생성 문서', status: 'Approved', tags: ['AI 생성'],\n      definition: '이 문서는 등록된 원본 문서로부터 AI가 자동 생성한 위키 항목입니다. 좌측 트리에서 다른 항목을 선택해 탐색하세요.',\n      meta: [{ k: '분류', v: f.group }, { k: '생성', v: 'AI 자동 변환' }, { k: '상태', v: 'Approved' }], functions: [], apis: [], tables: [], faqs: [] };\n  }\n\n  renderVals() {\n    const s = this.state;\n    const accent = this.props.accent || '#3B82F6';\n    const accentSoft = accent + '14';\n    const accentSoftBorder = accent + '33';\n    const activeSpace = s.spaces.find(x => x.id === s.activeSpaceId) || null;\n    const hasSpace = !!activeSpace;\n    const seeded = !!(activeSpace && activeSpace.seeded);\n    const spaceName = activeSpace ? activeSpace.name : 'Knowledge Space';\n    const spaceDesc = activeSpace ? activeSpace.desc : '선택하거나 새로 만드세요';\n    const spaceInitial = activeSpace ? activeSpace.name.trim().charAt(0) : '';\n    const spaceColor = activeSpace ? (activeSpace.color || accent) : accent;\n    const englishLabels = this.props.englishLabels != null ? this.props.englishLabels : true;\n    const compact = this.props.density === 'compact';\n    const contentStyle = { flex: 1, overflow: 'auto', padding: compact ? '20px 24px' : '30px 36px' };\n\n    const navBase = { display: 'flex', alignItems: 'center', gap: '11px', padding: '9px 11px', borderRadius: '9px', cursor: 'pointer', fontWeight: 500, fontSize: '14px', userSelect: 'none', lineHeight: 1.2, position: 'relative' };\n    const collapsed = !!s.collapsed;\n    const navBaseC = collapsed ? { ...navBase, justifyContent: 'center', padding: '10px 0' } : navBase;\n    const navStyle = (k) => s.active === k ? { ...navBaseC, background: accentSoft, color: accent } : { ...navBaseC, color: '#475569', background: 'transparent' };\n\n
